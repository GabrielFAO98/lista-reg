<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite — Rafaela & Gabriel</title>
<meta name="description" content="Abra seu convite digital para o casamento de Rafaela e Gabriel — 22 de agosto de 2026.">
<meta property="og:title" content="Convite — Rafaela & Gabriel">
<meta property="og:description" content="Você está convidado para o casamento de Rafaela e Gabriel! Abra seu convite digital.">
<meta property="og:image" content="https://gabrielfao98.github.io/lista-reg/img/noivos-convite.webp">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/convite.webp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>💍</text></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1206; }

/* ── INTRO ── */
#intro {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.3s ease;
}
.intro-frame {
  position: relative;
  display: inline-flex;
  max-width: 100vw;
  max-height: 100vh;
}
.intro-img {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto; height: auto;
}
/* botão invisível — posição em % da imagem */
.intro-inv-btn {
  position: absolute;
  width: 18%; padding-top: 18%;
  border-radius: 50%;
  top: calc(58% - 120px); left: calc(50% + 40px);
  transform: translate(-50%, -50%);
  background: transparent;
  border: none; outline: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
@media (min-width: 768px) {
  .intro-inv-btn {
    top: 40%; left: 60%;
    width: 6%; padding-top: 6%;
  }
}

/* ── FINALE ── */
#finale {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
#finale.visible { opacity: 1; pointer-events: auto; }

/* fundo embaçado — mesma imagem em cover atrás da imagem nítida */
#finale::before {
  content: '';
  position: absolute; inset: -40px;
  z-index: 0;
  background: url('img/fundo-desktop.webp') center / cover no-repeat;
  filter: blur(4px) brightness(0.85) saturate(0.9);
}
@media (min-width: 768px) {
  #finale::before {
    background-image: url('img/fundo-desktop.webp');
  }
}

/* wrapper se dimensiona exatamente como a imagem */
.finale-frame {
  position: relative;
  z-index: 1;
  display: inline-flex;
  max-width: 100vw;
  max-height: 100vh;
}

.finale-img {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto; height: auto;
}

/* botões invisíveis sobre os ícones da imagem */
.inv-btn {
  position: absolute;
  width: 22%; padding-top: 22%;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: transparent;
  border: none; outline: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.desktop-btn { display: none; }
@media (min-width: 768px) {
  .mobile-btn  { display: none; }
  .desktop-btn { display: block; width: 8%; padding-top: 8%; }
}
</style>
</head>
<body>

<div id="intro">
  <div class="intro-frame">
    <picture>
      <source media="(min-width: 768px)" srcset="img/convite-desktop-cover.webp">
      <img class="intro-img" src="img/convite.webp" alt="Convite de Rafaela & Gabriel">
    </picture>
    <button class="intro-inv-btn" onclick="abrirConvite()"></button>
  </div>
</div>

<div id="finale">
  <div class="finale-frame">
    <picture>
      <source media="(min-width: 768px)" srcset="img/convite-digital-desktop.webp">
      <img class="finale-img" src="img/convite-mobile.webp" alt="Convite digital — Rafaela & Gabriel">
    </picture>

    <!-- botões mobile (já calibrados) -->
    <a href="index.html"     class="inv-btn mobile-btn" style="left:20%; top:86%;"></a>
    <a href="rsvp.html"      class="inv-btn mobile-btn" style="left:50%; top:86%;"></a>
    <a href="presentes.html" class="inv-btn mobile-btn" style="left:80%; top:86%;"></a>

    <!-- botões desktop -->
    <a href="index.html"     class="inv-btn desktop-btn" style="left:39%; top:86%;"></a>
    <a href="rsvp.html"      class="inv-btn desktop-btn" style="left:50%; top:86%;"></a>
    <a href="presentes.html" class="inv-btn desktop-btn" style="left:61%; top:86%;"></a>
  </div>
</div>

<script>
  function abrirConvite() {
    var intro  = document.getElementById('intro');
    var finale = document.getElementById('finale');

    intro.style.opacity = '0';
    intro.style.pointerEvents = 'none';

    setTimeout(function() {
      intro.style.display = 'none';
      finale.classList.add('visible');
    }, 300);
  }
</script>
</body>
</html>
